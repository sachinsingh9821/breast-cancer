# Root Hydra config. Override groups on the CLI, e.g. `python scripts/train.py experiment=baseline`.
defaults:
  - data: cbis_ddsm
  - model: efficientnet_b0
  - train: default
  - experiment: null
  - _self_

seed: 42
project_name: breast-cancer
paths:
  root: ${hydra:runtime.cwd}
  raw: ${paths.root}/data/raw
  interim: ${paths.root}/data/interim
  processed: ${paths.root}/data/processed
  reports: ${paths.root}/reports
  figures: ${paths.reports}/figures

# scripts/preprocess.py: stages run in this order; override e.g. `preprocess.stages=[index]`
preprocess:
  stages: [index, splits, master, derive]

# scripts/qc_preprocessing.py
qc:
  subdir: master_2048 # which preprocessed copy under data.processed_dir to check
  review_n: 300       # fixed random sample rendered for manual artifact review
  cols: 8
  rows: 3
  tile_w: 200
  tile_h: 330
  detector:           # automatic edge-strip detector (breast_cancer.data.qc)
    work_long_side: 1024
    strip_band_frac: 0.04
    strip_level_frac: 0.95
    strip_min_frac: 0.3

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
